    }

    // 将数据里的 platform 字段规范为 open-digger / 链接用的短名（github、gitlab、atomgit、gitee）
    function normalizeRepoPlatform(platform) {
      if (platform == null || String(platform).trim() === '') return 'github';
      const raw = String(platform).trim();
      const lower = raw.toLowerCase().replace(/\/$/, '');
      if (lower.startsWith('http://') || lower.startsWith('https://')) {
        try {
          const u = new URL(lower);
          const h = u.hostname.replace(/^www\./, '');
          if (h === 'gitlab.com' || h.endsWith('.gitlab.com')) return 'gitlab';
          if (h === 'atomgit.com' || h.endsWith('.atomgit.com')) return 'atomgit';
          if (h === 'gitee.com') return 'gitee';
          if (h === 'github.com') return 'github';
        } catch (e) { /* ignore */ }
      }
      const slug = lower.replace(/\.com\/?$/, '').replace(/[^a-z0-9]+/g, '');
      if (slug === 'gitlab') return 'gitlab';
      if (slug === 'atomgit') return 'atomgit';
      if (slug === 'gitee') return 'gitee';
      if (slug === 'github') return 'github';
      if (lower.includes('gitlab')) return 'gitlab';
      if (lower.includes('atomgit')) return 'atomgit';
      if (lower.includes('gitee')) return 'gitee';
      const head = lower.replace(/\.com$/, '').split('/')[0];
      return head || 'github';
    }

    // 根据 platform 和 name 生成仓库链接
    function getRepoUrlByPlatform(platform, name) {
      if (!name) return '#';
      const p = normalizeRepoPlatform(platform);
      if (p === 'gitlab') return `https://gitlab.com/${name}`;
      if (p === 'atomgit') return `https://atomgit.com/${name}`;
      if (p === 'gitee') return `https://gitee.com/${name}`;
      return `https://github.com/${name}`;
    }

    const OPEN_DIGGER_PLATFORM_LOGO_BASE = 'https://oss.open-digger.cn/logos/';

    /** 根据 label 的 id（如 :companies/huawei）推断 OSS 上的 Logo URL，与排行榜 avatar 规则一致 */
    function inferLabelAvatarUrl(labelIdFull) {
      if (!labelIdFull || typeof labelIdFull !== 'string') return '';
      const path = labelIdFull.startsWith(':') ? labelIdFull.slice(1) : labelIdFull;
      if (!path) return '';
      return `${OPEN_DIGGER_PLATFORM_LOGO_BASE}${path}.png`;
    }

    // 详情内仓库链接前的平台图标（GitHub 用矢量图标，其余平台用 Open Digger OSS Logo）
    function getRepoPlatformIconHtml(platform, size) {
      const p = normalizeRepoPlatform(platform);
      const isSm = size === 'sm';
      const imgCls = isSm ? 'w-3.5 h-3.5' : 'w-3 h-3';
      const wh = isSm ? 14 : 12;
      if (p === 'github') {
        return `<iconify-icon icon="mdi:github" class="${imgCls} flex-shrink-0 inline-block align-middle" width="${wh}" height="${wh}" aria-hidden="true"></iconify-icon>`;
      }
      const src = `${OPEN_DIGGER_PLATFORM_LOGO_BASE}${p}.png`;
      return `<img src="${src}" alt="" class="${imgCls} flex-shrink-0 object-contain inline-block align-middle" width="${wh}" height="${wh}" decoding="async" />`;
    }

    const TREND_DATA_BASE = 'https://oss.open-digger.cn/';

    // 通用：根据 URL 映射拉取趋势数据（月度+年度），用于 repo 与 label
    async function fetchTrendDataByUrls(urls) {
      const result = {};
      await Promise.all(
        Object.entries(urls).map(async ([key, url]) => {
          try {
            const res = await fetch(url);
            const data = res.ok ? await res.json() : null;
            result[key] = data
              ? { monthly: getTrendDataFromJson(data), yearly: getTrendDataFromJsonYearly(data) }
              : EMPTY_TREND_PAIR;
          } catch (e) {
            result[key] = EMPTY_TREND_PAIR;
          }
        })
      );
      return result;
    }

    // 获取 repo 详情趋势数据（影响力、活跃度、参与者、Issue/PR）
    async function fetchRepoTrendData(platform, name) {
      if (!name) return null;
      const p = normalizeRepoPlatform(platform || 'github');
      const base = `${TREND_DATA_BASE}${p}/${name}/`;
      return fetchTrendDataByUrls({
        influence: base + 'openrank.json',
        activity: base + 'activity.json',
        participants: base + 'participants.json',
        issuePr: base + 'issues_and_change_request_active.json',
      });
    }

    // 获取 label 详情趋势数据；label_id 为数据列 id 去掉第一个字符
    async function fetchLabelTrendData(labelId) {
      if (!labelId) return null;
      const base = `${TREND_DATA_BASE}${labelId}/`;
      return fetchTrendDataByUrls({
        influence: base + 'openrank.json',
        activity: base + 'activity.json',
        participants: base + 'participants.json',
        issuePr: base + 'issues_and_change_request_active.json',
      });
    }

    // 从仓库/标签数据根路径获取 meta.json，返回 labels（name、name_zh）与 repos（仅 label 类型）
    async function fetchItemMeta(itemType, item) {
      const empty = { labels: [], repos: [], labelType: null, description: null, descriptionZh: null, contributions: [], metaAvatar: null, metaName: null, metaNameZh: null };
      if (!item) return { ...empty };
      let metaUrl = '';
      if (itemType === 'repo') {
        const p = normalizeRepoPlatform(item.platform || 'github');
        const name = item.name || (currentLanguage === 'zh' ? item.name_zh : item.name) || '';
        if (!name) return { ...empty };
        metaUrl = `${TREND_DATA_BASE}${p}/${name}/meta.json`;
      } else if (itemType === 'label') {
        const labelId = (item.id || '').slice(1);
        if (!labelId) return { ...empty };
        metaUrl = `${TREND_DATA_BASE}${labelId}/meta.json`;
      } else {
        return { ...empty };
      }
      try {
        const res = await fetch(metaUrl);
        const meta = res.ok ? await res.json() : null;
        const rawLabels = (meta && Array.isArray(meta.labels)) ? meta.labels : [];
        const labels = rawLabels.map(l => {
          if (!l || typeof l !== 'object') return { name: '', name_zh: '', id: null, type: null, avatar: null };
          return {
            name: l.name ?? '',
            name_zh: l.name_zh ?? '',
            id: l.id ?? null,
            type: (l.type ?? l.label_type ?? null),
            avatar: l.avatar ?? null,
          };
        });
        const rawRepos = (itemType === 'label' && meta && Array.isArray(meta.repos)) ? meta.repos : [];
        const repos = rawRepos.filter(r => r != null);
        const labelType = (itemType === 'label' && meta) ? (meta.label_type ?? null) : null;
        const description = (itemType === 'label' && meta) ? (meta.description ?? null) : null;
        const descriptionZh = (itemType === 'label' && meta) ? (meta.description_zh ?? null) : null;
        const contributions = (meta && Array.isArray(meta.contributions)) ? meta.contributions : [];
        const metaAvatar = (itemType === 'label' && meta) ? (meta.avatar ?? meta.logo ?? null) : null;
        const metaName = (itemType === 'label' && meta) ? (meta.name ?? null) : null;
        const metaNameZh = (itemType === 'label' && meta) ? (meta.name_zh ?? null) : null;
        return { labels, repos, labelType, description, descriptionZh, contributions, metaAvatar, metaName, metaNameZh };
      } catch (e) {
        return { ...empty };
      }
    }

    /** 用 meta.json 根字段与 OSS Logo 规则补全从详情内跳转得到的精简 item */
    function enrichLabelItemWithMeta(item, itemMeta) {
      const base = item && typeof item === 'object' ? item : {};
      const inferred = inferLabelAvatarUrl(base.id);
      return {
        ...base,
        itemType: 'label',
        avatar: base.avatar || base.logo || itemMeta.metaAvatar || inferred || '',
        name: base.name || itemMeta.metaName || '',
        name_zh: base.name_zh || itemMeta.metaNameZh || '',
        description: base.description || itemMeta.description || '',
        description_zh: base.description_zh || itemMeta.descriptionZh || '',
      };
    }

    /** label 详情头部描述：仅使用 meta 的 description / description_zh；字段不存在或仅为空白时，用语种对应的 name 作为描述文案。 */
    function getLabelDetailDescriptionFromMeta(langZh, metaDesc, metaDescZh, item) {
      const raw = langZh ? metaDescZh : metaDesc;
      if (raw != null && String(raw).trim() !== '') return String(raw).trim();
      const nameFallback = !langZh ? (item.name_zh || item.name || '') : (item.name || item.name_zh || '');
      return String(nameFallback || '').trim();
    }

    // 渲染 label/repo 详情面板；trendData 为 repo 或 label 的趋势数据；trendMode 为 'month' | 'year'；metaLabels 为 meta.json 中的 labels；metaRepos 为 meta.json 中的 repos；metaLabelType/metaDesc/metaDescZh 为 label 的 meta 根级字段（仅 label 使用）；contributions 为国家贡献度分布数据
    function renderDetailLabelRepo(item, trendData, trendMode, metaLabels, metaRepos, metaLabelType, metaDesc, metaDescZh, contributions) {
      const mode = (trendMode || 'month');
      const itemType = (item.itemType || getItemType()).toLowerCase();
      const isRepo = itemType === 'repo';

      const desc = isLabel
        ? getLabelDetailDescriptionFromMeta(langZh, metaDesc, metaDescZh, item)
        : (!langZh ? (item.desc_zh || item.description_zh || item.description || item.desc || '')
        : (item.description || item.desc || item.description_zh || item.desc_zh || ''));
      const metaLabelTypeMapKey = metaLabelType && isDivisionZeroTypeName(metaLabelType) ? 'Division-0' : metaLabelType;
      const labelTypeDesc = (metaLabelTypeMapKey && LABEL_TYPE_MAP[metaLabelTypeMapKey])
        ? (currentLanguage === 'zh' ? LABEL_TYPE_MAP[metaLabelTypeMapKey].zh : LABEL_TYPE_MAP[metaLabelTypeMapKey].en)
        : (metaLabelType || '');
      const badgeText = isRepo
        ? (currentLanguage === 'zh' ? LABEL_TYPE_MAP['repo'].zh : LABEL_TYPE_MAP['repo'].en)
        : (isLabel && labelTypeDesc ? labelTypeDesc : '');

      const labelTypeBadgeHtml = badgeText

      const useReal = (isRepo || isLabel) && trendData && (getTrend('influence') || getTrend('activity'));
      const influenceTrend = useReal && getTrend('influence') ? getTrend('influence') : EMPTY_TREND;

      const issuePrTrend = useReal && getTrend('issuePr') ? getTrend('issuePr') : EMPTY_TREND;
      const contributors = item.contributors || [];
      const getRepoHref = (r) => { const p = r.platform || r.Platform; return p ? getRepoUrlByPlatform(p, r.name || r) : (r.url || '#'); };
      const repoSectionHtml = isRepo
        ? `<div class="w-full">

            <a href="${getRepoUrlByPlatform(item.platform, repoName)}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-dark-700 border border-dark-600 text-slate-300 hover:border-accent/50 text-xs font-mono">
              ${getRepoPlatformIconHtml(item.platform, 'sm')}
              <span class="truncate">${repoName}</span>
            </a>
          </div>`
        : (repos.length ? `
            <div class="w-full">
              <h4 class="text-sm font-mono font-semibold text-slate-300 mb-2">${currentLanguage === 'zh' ? '仓库列表' : 'Repositories'}</h4>
              <div class="flex flex-wrap gap-1.5">
                ${repos.map(r => {
                  const name = r.name || r;

                  return `<a href="${href}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-dark-700 border border-dark-600 text-slate-300 hover:border-accent/50 text-[11px] font-mono leading-tight">${iconHtml}<span class="truncate max-w-[8rem]">${name}</span></a>`;
                }).join('')}
              </div>
            </div>
          ` : '');
      const inlineLabelsHtml = (isRepo || isLabel) && (rawMetaLabels.length || rawMetaLabels.some(l => l.name || l.name_zh))
        ? (rawMetaLabels.length ? rawMetaLabels.map(l => {
            const text = currentLanguage === 'zh' ? (l.name_zh || l.name || '') : (l.name || l.name_zh || '');
            if (!text) return '';
            const metaType = l.type || null;

            if (clickable) {

              }

            }
            return `<span class="inline-block px-2 py-0.5 rounded text-[11px] font-mono leading-tight bg-dark-600 text-slate-300 border border-dark-500">${text}</span>`;
          }).filter(Boolean).join('') : '')
        : '';
      const getChangePct = (latest, prev) => {

      const getPrev = (t) => { const v = t?.values || []; return v.length >= 2 ? Number(v[v.length - 2]) : 0; };
      const infLatest = getLatest(influenceTrend), infPrev = getPrev(influenceTrend);
      const actLatest = getLatest(activityTrend), actPrev = getPrev(activityTrend);

      const infPct = getChangePct(infLatest, infPrev), actPct = getChangePct(actLatest, actPrev), devPct = getChangePct(devLatest, devPrev);
      const timeKey = (influenceTrend?.months?.length ? influenceTrend.months[influenceTrend.months.length - 1] : '') || '';
      const basicInfoHtml = (isRepo || isLabel) ? `

    // 初始化标题背景动效
    function initTitleBackground() {
      const titleContainer = document.querySelector('.title-background');
      if (!titleContainer) return;
      
      const canvas = document.getElementById('networkCanvas');
      const starsContainer = document.getElementById('starsContainer');
      const particlesContainer = document.getElementById('particlesContainer');
      
      if (!canvas || !starsContainer || !particlesContainer) return;
      
      const ctx = canvas.getContext('2d');
      
      function resizeCanvas() {
        const rect = titleContainer.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      
      // 网络节点配置
      const nodeCount = 15;
      const nodes = [];
      const maxDistance = 150; // 节点连接的最大距离
      
      // 创建节点
      for (let i = 0; i < nodeCount; i++) {
        nodes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          radius: Math.random() * 2 + 1
        });
      }
      
      // 绘制网络
      function drawNetwork() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 更新节点位置
        nodes.forEach(node => {
          node.x += node.vx;
          node.y += node.vy;
          
          // 边界反弹
          if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
          if (node.y < 0 || node.y > canvas.height) node.vy *= -1;
          
          // 限制在边界内
          node.x = Math.max(0, Math.min(canvas.width, node.x));
          node.y = Math.max(0, Math.min(canvas.height, node.y));
        });
        
        // 绘制连接线（科技绿）
        ctx.strokeStyle = 'rgba(34, 197, 94, 0.2)';
        ctx.lineWidth = 0.5;
        
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < maxDistance) {
              const opacity = 1 - (distance / maxDistance);
              ctx.strokeStyle = `rgba(34, 197, 94, ${opacity * 0.35})`;
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.stroke();
            }
          }
        }
        
        // 绘制节点
        nodes.forEach(node => {
          ctx.fillStyle = 'rgba(34, 197, 94, 0.5)';
          ctx.beginPath();
          ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
          ctx.fill();
        });
      }
      
      // 创建星星
      function createStars() {
        const starCount = 20;
        starsContainer.innerHTML = '';
        
        for (let i = 0; i < starCount; i++) {
          const star = document.createElement('div');
          star.className = 'star';
          const size = Math.random() * 3 + 1;
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          const delay = Math.random() * 3;
          
          star.style.width = size + 'px';
          star.style.height = size + 'px';
          star.style.left = x + '%';
          star.style.top = y + '%';
          star.style.animationDelay = delay + 's';
          star.style.animationDuration = (Math.random() * 2 + 2) + 's';
          
          starsContainer.appendChild(star);
        }
      }
      
      // 创建粒子
      function createParticles() {
        const particleCount = 8;
        particlesContainer.innerHTML = '';
        
        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          const size = Math.random() * 60 + 40;
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          const delay = Math.random() * 5;
          
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          particle.style.left = x + '%';
          particle.style.top = y + '%';
          particle.style.animationDelay = delay + 's';
          particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
          
          particlesContainer.appendChild(particle);
        }
      }
      
      createStars();
      createParticles();
      
      function animate() {
        drawNetwork();
        requestAnimationFrame(animate);
      }
      
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        animate();
      } else {
        drawNetwork();
      }
    }

    // 页面加载完成后初始化
    window.addEventListener('load', async () => {
      // 设置初始语言
      document.documentElement.lang = currentLanguage === 'zh' ? 'zh-CN' : 'en';
      updateTranslations();
      bindTimeTypeToggle();
      initTimeInputs();
      
      // 初始化标题背景动效
      initTitleBackground();
      
      // 筛选下拉框：阻止滚动传递到页面
      [document.getElementById('scopeDropdownMenu'), document.getElementById('unitDropdownMenu')].forEach(menu => {
        if (menu) menu.addEventListener('wheel', preventFilterDropdownScrollChaining, { passive: false });
      });
      
      // 加载元数据
      await loadMetaData();
    });
  </script>
